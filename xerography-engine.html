const DR = 16, ZD = 106, SPEED = 20, PERIOD = 11, BXR = 214, BXL = -200, T0 = 0.1342917352885138, START_LEAD = -184;
const PX = -215.3, NIP2 = 75, FUSE_Z = 128, SHEET = 72, MARGIN = 8, CELL_X = 4, ROS_TOP = 150, EXPOSE = 80;
const POLY = XS.map((x) => [x - 10, -20]);
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const part = (id) => svg.querySelector('[data-part="' + id + '"]');
const V = (() => { const o = depthOf([0, 0, 0], P); return [depthOf([1, 0, 0], P) - o, depthOf([0, 1, 0], P) - o, depthOf([0, 0, 1], P) - o]; })();
const viewLen = Math.hypot(V[0], V[1], V[2]);
const f2 = (n) => n.toFixed(1);
const seg = (a, b) => { const A = iso(a, P), B = iso(b, P); return "M" + f2(A[0]) + " " + f2(A[1]) + "L" + f2(B[0]) + " " + f2(B[1]); };

/* a line along a roller that lies along y, at turning angle t (0 = +x, 90 = up) */
function axleLine(el, t, count) {
  const [x, z, r, y0, y1] = el.dataset.axle.split(",").map(Number);
  let d = "";
  for (let i = 0; i < count; i++) {
    const a = t + (i / count) * Math.PI * 2;
    const facing = (Math.cos(a) * V[0] + Math.sin(a) * V[2]) / viewLen;
    if (facing < 0.14) continue;
    d += seg([x + r * Math.cos(a), y0, z + r * Math.sin(a)], [x + r * Math.cos(a), y1, z + r * Math.sin(a)]);
  }
  el.setAttribute("d", d);
}

// turning direction, +1 counter-clockwise: surfaces that touch each other move together, so neighbours turn opposite ways
const DIRS = { drum: 1, gear: 1, mag: -1, chg: -1, ptr: -1, blt: -1, str: 1, hot: -1, prs: 1, reg0: 1, reg1: -1 };
const rollers = Array.from(svg.querySelectorAll("[data-axle]")).map((el) => {
  const id = el.dataset.part;
  const key = id in DIRS ? id : id.replace(/[0-9]+$/, "");
  return { el, id, dir: DIRS[key] ?? 1, r: Number(el.dataset.axle.split(",")[2]), teeth: Number(el.dataset.teeth || 0), phase: id.startsWith("drum") ? Math.PI / 2 : 0 };
});

const polys = XS.map((_, i) => part("poly" + i));
const hexRing = (cx, cy, r, a) => Array.from({ length: 6 }, (_, j) => [cx + r * Math.cos(a + (j * Math.PI) / 3), cy + r * Math.sin(a + (j * Math.PI) / 3)]);

const frames = [part("frame0"), part("frame1")].map((g) => ({
  g,
  columns: Array.from(g.querySelectorAll("[data-col]")).map((el) => ({ el, layer: Number(el.dataset.layer), col: Number(el.dataset.col), shown: false })),
}));
const paper = part("paper");
const rows = Array.from(paper.querySelectorAll("[data-row]")).map((el) => ({ el, row: Number(el.dataset.row), alpha: -1 }));

/* ---- the process, as a function of where a mark on the drum is ---- */
const STAGES = [
  { to: 65, text: "전사 직후 · 잔류 토너" },
  { to: 120, text: "클리닝 후 · 표면 정리" },
  { to: 170, text: "대전 롤러 −600 V" },
  { to: 265, text: "노광 −100 V / −600 V" },
  { to: 361, text: "현상 · 토너 부착" },
];
const stageOf = (u) => STAGES.find((s) => u < s.to) || STAGES[STAGES.length - 1];
const TARGETS = [0, 1, 2, 3, 4];
let target = 3;
let touring = true, tourClock = 0, tourIndex = 3, idleTimer = 0;
let clock = Number(new URLSearchParams(location.search).get("t") || 0), last = 0, frameId = 0, visible = false;
let lastText = "", shownTarget = -1;

function highlight(sel) {
  if (sel === shownTarget) return;
  shownTarget = sel;
  XS.forEach((_, i) => {
    for (const id of ["drum", "fan", "drop"]) part(id + i).setAttribute("data-tone", i === sel ? "lit" : "hi");
  });
  part("hot").setAttribute("data-tone", sel === 4 ? "lit" : "hi");
}

function draw() {
  for (const roll of rollers) {
    const t = roll.dir * ((SPEED * clock) / roll.r) + roll.phase;
    axleLine(roll.el, t, roll.teeth || 1);
  }
  // toner images ride the belt; a layer appears once the cell has passed its drum's nip
  frames.forEach((fr, n) => {
    const local = (clock + n * PERIOD) % (2 * PERIOD);
    const lead = START_LEAD + SPEED * local;
    fr.g.setAttribute("transform", translateAlong(P, [lead, 0, 0]));
    for (const c of fr.columns) {
      const worldX = lead - (c.col + 0.5) * CELL_X;
      const on = worldX > XS[c.layer] + 6 && worldX < BXR;
      if (on !== c.shown) { c.el.style.display = on ? "" : "none"; c.shown = on; }
    }
  });
  // the sheet rises through the secondary nip; its image's leading row is there when the belt's leading column arrives
  const sheetT = clock % PERIOD;
  const bottom = NIP2 - SHEET + MARGIN + SPEED * (sheetT - T0);
  paper.setAttribute("transform", translateAlong(P, [0, 0, bottom]));
  for (const r of rows) {
    const z = bottom + SHEET - MARGIN - (r.row + 0.5) * CELL_X;
    const a = z < NIP2 ? 0 : z < FUSE_Z ? 0.55 : 0.97;
    if (a !== r.alpha) { r.el.setAttribute("opacity", String(a)); r.alpha = a; }
  }
  // laser scan: the spot sweeps the lens, drops through the slit and lands on the drum
  XS.forEach((x, i) => {
    const sweep = (clock * 1.7 + i * 0.37) % 1;
    const ys = -22 + 44 * (sweep < 0.5 ? sweep * 2 : 2 - sweep * 2);
    const lensX = x + DR * Math.cos((EXPOSE * Math.PI) / 180);
    const [px, py] = POLY[i];
    part("fan" + i).setAttribute("d", seg([px, py, ROS_TOP + 8], [lensX, ys, ROS_TOP + 5.3]));
    const hit = [lensX, ys, ZD + DR * Math.sin((EXPOSE * Math.PI) / 180)];
    part("drop" + i).setAttribute("d", seg([lensX, ys, ROS_TOP], hit));
    const dot = part("spot" + i).firstChild, hp = iso(hit, P);
    dot.setAttribute("cx", f2(hp[0])); dot.setAttribute("cy", f2(hp[1]));
    polys[i].innerHTML = solidSvg(extrude(hexRing(px, py, 5.2, clock * 6 + i), ROS_TOP + 3, 4, P, {}), { tone: "hi", crease: "lo" });
  });
  highlight(target);
  let text;
  if (target < 4) {
    const deg = (((90 + ((SPEED * clock) / DR) * 180 / Math.PI) % 360) + 360) % 360;
    const u = (((deg - 270) % 360) + 360) % 360;
    text = NAMES[target] + " 드럼 · " + stageOf(u).text;
  } else {
    text = "정착 · 약 170 ℃ 열 + 압력으로 토너를 녹여 고정";
  }
  if (focusText) text = focusText;
  if (text !== lastText) { readout.textContent = text; lastText = text; stage.setAttribute("aria-valuetext", text); stage.setAttribute("aria-valuenow", String(target)); }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (!still.matches) clock += dt;
  if (touring) {
    tourClock += dt;
    if (tourClock > 4.2) { tourClock = 0; tourIndex = (tourIndex + 1) % TARGETS.length; target = TARGETS[tourIndex]; }
  }
  draw();
  frameId = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frameId && visible) { last = 0; frameId = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

const pick = (next) => {
  if (focusText || focusIds.length) { focusText = null; setFocus([]); try { parent.postMessage({ dsitUser: true }, "*"); } catch (e) {} }
  touring = false; target = next; clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; tourClock = 0; tourIndex = target; }, 6000);
  if (still.matches) draw();
};
const anchors = [...XS.map((x) => iso([x, 0, ZD], P)), iso([PX + 9, 0, FUSE_Z], P)];
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = ((event.clientX - box.left) / box.width) * vb.width;
  const py = ((event.clientY - box.top) / box.height) * vb.height;
  let best = 0, dist = 1e9;
  anchors.forEach((a, i) => { const d = Math.hypot(a[0] - px, (a[1] - py) * 1.3); if (d < dist) { dist = d; best = i; } });
  pick(best);
});
stage.addEventListener("keydown", (event) => {
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") next = (target + 1) % TARGETS.length;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = (target + TARGETS.length - 1) % TARGETS.length;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = TARGETS.length - 1;
  if (next === null) return;
  event.preventDefault();
  pick(next);
});
/* ---- DSIT: 바깥 페이지에서 부품을 짚어 보여주는 기능 ---- */
let focusText = null, focusIds = [];
const NS = "http://www.w3.org/2000/svg";
const ringLayer = document.createElementNS(NS, "g");
ringLayer.setAttribute("class", "dsit-focus");
svg.appendChild(ringLayer);
const ptsAttr = (pts) => pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
function ringFor(id) {
  if (id.startsWith("poly")) {
    const [px, py] = POLY[Number(id.slice(4))];
    return [hexRing(px, py, 9, 0).map(([x, y]) => iso([x, y, ROS_TOP + 5], P))];
  }
  const el = part(id);
  if (!el || !el.dataset.axle) return [];
  const [x, z, r, y0, y1] = el.dataset.axle.split(",").map(Number);
  const R = r + 2.5;
  return [y0, y1].map((y) => Array.from({ length: 28 }, (_, j) => {
    const a = (j / 28) * Math.PI * 2;
    return iso([x + R * Math.cos(a), y, z + R * Math.sin(a)], P);
  }));
}
function setFocus(ids, label) {
  focusIds.forEach((id) => { const el = part(id); if (el) el.classList.remove("dsit-on"); });
  ringLayer.innerHTML = "";
  focusIds = ids;
  let top = null;
  ids.forEach((id) => {
    const el = part(id); if (el) el.classList.add("dsit-on");
    ringFor(id).forEach((pts) => {
      const poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", ptsAttr(pts));
      ringLayer.appendChild(poly);
      pts.forEach((p) => { if (!top || p[1] < top[1]) top = p; });
    });
  });
  if (label && top) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", top[0].toFixed(1)); t.setAttribute("y", (top[1] - 10).toFixed(1)); t.setAttribute("text-anchor", "middle");
    t.textContent = label;
    ringLayer.appendChild(t);
  }
}
addEventListener("message", (event) => {
  const d = event.data;
  if (!d || !d.dsit) return;
  if (d.dsit === "focus") {
    touring = false; clearTimeout(idleTimer);
    target = typeof d.target === "number" ? d.target : -1;
    focusText = d.text || null;
    setFocus(d.parts || [], d.label || "");
    if (still.matches || !frameId) draw();
  } else if (d.dsit === "tour") {
    focusText = null; setFocus([]); touring = !still.matches; tourClock = 0;
    if (still.matches || !frameId) draw();
  }
});
const report = () => { try { parent.postMessage({ dsitH: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*"); } catch (e) {} };
new ResizeObserver(report).observe(document.body);
addEventListener("load", report);
try { parent.postMessage({ dsitReady: true }, "*"); } catch (e) {}
draw();
</script></body></html>
