<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#07112A;--navy-2:#0C1B3D;--cyan:#27C4E8;--cyan-ink:#06789A;--bg:#F2F5F9;--surface:#fff;--ink:#0D1830;--muted:#566781;--line:#DCE3EC;--chip:#E3F5FB;
  --new:#E4448F;--doing:#E0A410;--done:#1FA971;--hold:#8391A7;
  --kr:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--en:"Sora","IBM Plex Sans KR",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--kr);background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
.top .in{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand b{font:600 11px/1 var(--en);letter-spacing:.2em;color:var(--cyan)}
.refresh{height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:13.5px;font-weight:600}
.refresh:hover{background:rgba(255,255,255,.14)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left}
.stat small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stat small i{width:8px;height:8px;border-radius:50%}
.stat strong{display:block;font:600 26px/1.3 var(--en);margin-top:4px}
.stat.on{border-color:var(--cyan-ink);box-shadow:0 0 0 2px rgba(39,196,232,.2)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--surface)}
.bar input:focus{outline:none;border-color:var(--cyan-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:90px 1.2fr 1fr 120px 2fr 130px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#F7FAFC}
.row.head{background:var(--bg);font-size:12.5px;color:var(--muted);cursor:default;font-weight:600}
.row .msg{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{font-size:13px;color:var(--muted)}
.nm{font-weight:600}.nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-신규{background:#FCE7F1;color:#B42A6B}.b-처리중{background:#FDF3D6;color:#94680A}.b-완료{background:#DDF5EA;color:#157A51}.b-보류{background:#ECEFF4;color:#5B6880}
.type{font-size:12.5px;color:var(--cyan-ink);font-weight:600}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.drawer-bg{position:fixed;inset:0;background:rgba(7,17,42,.45);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.open .drawer-bg{display:block}.open .drawer{transform:none}
.d-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h2{margin:4px 0 0;font-size:20px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;flex:none}
.d-body{padding:20px 24px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:90px 1fr;gap:10px 14px;font-size:14.5px;margin-bottom:20px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.kv a{color:var(--cyan-ink);font-weight:600}
.msgbox{background:var(--bg);border-radius:12px;padding:16px;white-space:pre-wrap;font-size:14.5px;margin-bottom:22px;min-height:60px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.d-body select,.d-body textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);margin-bottom:16px}
.d-body textarea{height:120px;resize:vertical}
.d-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px}
.save{flex:1;height:48px;border:0;border-radius:10px;background:var(--cyan);color:var(--navy);font-weight:700;cursor:pointer}
.save:disabled{opacity:.6;cursor:wait}
.call{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .stats{grid-template-columns:1fr 1fr}
  .row.head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"nm badge" "type dt" "msg msg";gap:6px 12px}
  .row .c-nm{grid-area:nm}.row .c-badge{grid-area:badge;justify-self:end}.row .c-type{grid-area:type}
  .row .c-dt{grid-area:dt;justify-self:end}.row .msg{grid-area:msg}.row .c-phone{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span>디에스아이티</span><b>ADMIN</b></div>
  <button class="refresh" id="refresh">새로고침</button>
</div></header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar"><input id="q" type="search" placeholder="이름, 회사, 연락처, 내용 검색"></div>
  <div class="list" id="list"><div class="loading">불러오는 중...</div></div>
</main>

<div class="drawer-bg" id="bg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head"><div><span class="type" id="d-type"></span><h2 id="d-name"></h2></div><button class="x" id="close" aria-label="닫기">×</button></div>
  <div class="d-body">
    <dl class="kv" id="d-kv"></dl>
    <label>문의 내용</label>
    <div class="msgbox" id="d-msg"></div>
    <label for="d-status">처리 상태</label>
    <select id="d-status"><option>신규</option><option>처리중</option><option>완료</option><option>보류</option></select>
    <label for="d-memo">관리자 메모</label>
    <textarea id="d-memo" placeholder="통화 내용, 견적 금액, 방문 일정 등"></textarea>
  </div>
  <div class="d-foot"><a class="call" id="d-call" href="#">전화 걸기</a><button class="save" id="save">저장</button></div>
</aside>
<div class="toast" id="toast"></div>

<script>
var ALL=[], FILTER='전체', CUR=null;
var COLORS={'전체':'#07112A','신규':'#E4448F','처리중':'#E0A410','완료':'#1FA971'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}

function load(){
  $('list').innerHTML='<div class="loading">불러오는 중...</div>';
  google.script.run.withSuccessHandler(function(d){ALL=d||[];render();})
    .withFailureHandler(function(e){$('list').innerHTML='<div class="empty">불러오기 실패: '+esc(e.message)+'</div>';})
    .getInquiries();
}

function render(){
  var cnt={'전체':ALL.length,'신규':0,'처리중':0,'완료':0};
  ALL.forEach(function(r){if(cnt[r.status]!=null)cnt[r.status]++;});
  $('stats').innerHTML=['전체','신규','처리중','완료'].map(function(k){
    return '<button class="stat'+(FILTER===k?' on':'')+'" data-f="'+k+'"><small><i style="background:'+COLORS[k]+'"></i>'+k+'</small><strong>'+cnt[k]+'</strong></button>';
  }).join('');
  document.querySelectorAll('.stat').forEach(function(b){b.onclick=function(){FILTER=b.dataset.f;render();};});

  var q=$('q').value.trim().toLowerCase();
  var rows=ALL.filter(function(r){
    if(FILTER!=='전체'&&r.status!==FILTER)return false;
    if(!q)return true;
    return [r.name,r.company,r.phone,r.message,r.memo].join(' ').toLowerCase().indexOf(q)>=0;
  });
  if(!rows.length){$('list').innerHTML='<div class="empty">'+(ALL.length?'조건에 맞는 문의가 없습니다.':'아직 접수된 문의가 없습니다.')+'</div>';return;}
  $('list').innerHTML='<div class="row head"><span>상태</span><span>이름·회사</span><span>연락처</span><span>유형</span><span>내용</span><span>접수일시</span></div>'+
    rows.map(function(r){
      return '<div class="row" data-id="'+esc(r.id)+'">'+
        '<span class="c-badge"><span class="badge b-'+esc(r.status)+'">'+esc(r.status)+'</span></span>'+
        '<span class="c-nm nm">'+esc(r.name)+(r.company?'<small>'+esc(r.company)+'</small>':'')+'</span>'+
        '<span class="c-phone">'+esc(r.phone)+'</span>'+
        '<span class="c-type type">'+esc(r.type)+'</span>'+
        '<span class="msg">'+esc(r.message||'-')+'</span>'+
        '<span class="c-dt dt">'+esc(r.createdAt)+'</span></div>';
    }).join('');
  document.querySelectorAll('.row[data-id]').forEach(function(el){el.onclick=function(){openItem(el.dataset.id);};});
}

function openItem(id){
  CUR=ALL.filter(function(r){return r.id===id;})[0]; if(!CUR)return;
  $('d-type').textContent=CUR.type; $('d-name').textContent=CUR.name;
  $('d-kv').innerHTML='<dt>회사·기관</dt><dd>'+esc(CUR.company||'-')+'</dd>'+
    '<dt>연락처</dt><dd><a href="tel:'+esc(CUR.phone.replace(/[^0-9+]/g,''))+'">'+esc(CUR.phone)+'</a></dd>'+
    '<dt>접수일시</dt><dd>'+esc(CUR.createdAt)+'</dd>'+
    (CUR.doneAt?'<dt>처리완료</dt><dd>'+esc(CUR.doneAt)+'</dd>':'')+
    '<dt>접수번호</dt><dd>'+esc(CUR.id)+'</dd>';
  $('d-msg').textContent=CUR.message||'(내용 없음)';
  $('d-status').value=CUR.status; $('d-memo').value=CUR.memo||'';
  $('d-call').href='tel:'+CUR.phone.replace(/[^0-9+]/g,'');
  document.body.classList.add('open'); $('drawer').setAttribute('aria-hidden','false');
}
function closeItem(){document.body.classList.remove('open');$('drawer').setAttribute('aria-hidden','true');CUR=null;}

$('save').onclick=function(){
  if(!CUR)return;
  var st=$('d-status').value, memo=$('d-memo').value, btn=this; btn.disabled=true;
  google.script.run.withSuccessHandler(function(){
      CUR.status=st; CUR.memo=memo; btn.disabled=false; toast('저장했습니다'); closeItem(); render();
    }).withFailureHandler(function(e){btn.disabled=false; toast('저장 실패: '+e.message);})
    .updateInquiry(CUR.id,st,memo);
};
$('close').onclick=closeItem; $('bg').onclick=closeItem;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeItem();});
$('q').oninput=render; $('refresh').onclick=load;
load();
</script>
</body>
</html>
